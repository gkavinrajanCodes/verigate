name: Verigate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway-tests:
    name: Gateway Unit Tests (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: gateway/go.sum

      - name: Run Go Tests
        run: |
          cd gateway
          go test -v -race ./...

      - name: Build Gateway Binary
        run: |
          cd gateway
          go build -v -o verigate-gateway ./cmd/verigate-gateway

  verifier-tests:
    name: Verifier Unit Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e verifier/
          pip install pytest httpx

      - name: Run Pytest Suite
        run: |
          export PYTHONPATH="verifier:$PYTHONPATH"
          pytest -v verifier/tests

  integration-smoke-test:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go & Python
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Redis
        uses: supercharge/redis-github-action@1.7.0
        with:
          redis-version: 7

      - name: Build & Start Mock Upstream and Gateway
        run: |
          cd gateway
          go build -o mock-upstream ./cmd/mock-upstream
          ./mock-upstream --port 9099 &
          go build -o verigate-gateway ./cmd/verigate-gateway
          export VERIGATE_AUDIT_SECRET="test-secret"
          ./verigate-gateway --config ../verigate.yaml &
          sleep 2

      - name: Verify Proxy Health
        run: |
          curl -f http://127.0.0.1:8080/healthz || exit 1
