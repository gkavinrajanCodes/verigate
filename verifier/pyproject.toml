[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verigate-verifier"
version = "0.1.0"
description = "Verigate verifier: re-scores sampled LLM provider outputs with a trusted reference model."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.30",
  "redis>=5.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
lab = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
verigate = "verigate_verifier.cli:main"

[tool.setuptools.packages.find]
include = ["verigate_verifier*"]

[tool.setuptools.package-data]
verigate_verifier = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
